<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔗糖的表情包小屋~</title>
<style>
  :root { --bg:#fff5f8; --panel:#fffdfa; --line:#f3c6d8; --text:#5a3a48; --dim:#b98da0; --acc:#ff7fa9; --acc2:#ffb3cd; --ok:#e8749c; --bad:#e06c5a; --pend:#d9a441; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    color:var(--text); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; padding:24px; min-height:100vh;
    background:linear-gradient(120deg,#ffe3ee,#fff0e0,#e8e3ff,#ffdff0,#ffe3ee);
    background-size:400% 400%;
    animation:bgflow 18s ease infinite;
  }
  @keyframes bgflow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  h1 { font-size:18px; font-weight:600; letter-spacing:.5px; margin-bottom:4px; color:#e2568a; text-shadow:0 1px 0 #fff; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:4px; }
  .sub b { color:var(--ok); } .sub i { color:var(--bad); font-style:normal; }
  #pathline { color:var(--dim); font-size:11px; margin-bottom:14px; word-break:break-all; user-select:text; }
  #pathline code, #cfgpath code { color:var(--ok); background:#ffffffa0; padding:0 5px; border-radius:5px; font-family:Consolas,monospace; }
  #cfgpath { color:var(--dim); font-size:11px; margin-bottom:14px; word-break:break-all; user-select:text; }
  .tabs { display:flex; gap:22px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .tab { padding:0 2px 9px; cursor:pointer; font-size:13.5px; color:var(--dim); border-bottom:2px solid transparent; user-select:none; }
  .tab:hover { color:#e2568a; }
  .tab.act { color:#e2568a; font-weight:600; border-bottom-color:var(--acc); }
  #drop { border:1.5px dashed var(--line); border-radius:10px; padding:28px; text-align:center; color:var(--dim); cursor:pointer; transition:.2s; margin-bottom:20px; background:#ffffffa8; }
  #drop.hover, #drop:hover { border-color:var(--acc); color:#e2568a; background:#ffffffd9; }
  #drop input { display:none; }
  body.dragging::after {
    content:'松手即可上传'; position:fixed; inset:0; z-index:50; pointer-events:none;
    background:#ff7fa922; border:3px dashed var(--acc);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:600; color:#e2568a;
  }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .bar input[type=text] { background:#ffffffcc; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 12px; width:240px; outline:none; transition:.15s; }
  .bar input:focus { border-color:var(--acc); box-shadow:0 0 0 3px #ff7fa933; }
  .btn { background:#ffffffd9; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; transition:.15s; }
  .btn:hover { border-color:var(--acc); color:#e2568a; transform:translateY(-1px); }
  .btn.warn { color:var(--bad); }
  .btn.ok { color:var(--ok); }
  .chipf { padding:4px 12px; }
  .chipf.active { border-color:var(--acc); background:var(--acc); color:#fff; }
  .chipf .n { opacity:.75; font-size:11px; margin-left:2px; }
  .count { color:var(--dim); font-size:12px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; transition:.18s; box-shadow:0 2px 10px #ffb6c933; }
  .card:hover { transform:translateY(-3px); box-shadow:0 8px 22px #ff9fbd44; border-color:var(--acc2); }
  .thumb { height:170px; background:#fff0f5; display:flex; align-items:center; justify-content:center; position:relative; }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .badge { position:absolute; top:6px; right:6px; font-size:11px; padding:1px 8px; border-radius:10px; background:#ffffffd9; border:1px solid var(--line); }
  .badge.complete { color:var(--ok); } .badge.pending { color:var(--pend); } .badge.failed,.badge.none { color:var(--bad); }
  .meta { padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .meta input.f { width:100%; background:transparent; border:none; border-bottom:1px solid transparent; color:var(--text); font-size:13px; padding:2px 0; outline:none; }
  .meta input.f:focus { border-bottom-color:var(--acc); }
  .meta input.name { font-weight:600; font-size:14px; }
  .meta textarea { width:100%; background:transparent; border:1px solid transparent; color:var(--dim); font-size:12px; resize:vertical; min-height:34px; outline:none; font-family:inherit; }
  .meta textarea:focus { border-color:var(--line); color:var(--text); }
  .row { display:flex; gap:6px; margin-top:auto; padding-top:6px; }
  .row .btn { padding:3px 10px; font-size:12px; flex:0 0 auto; }
  .err { color:var(--bad); font-size:11px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#fff; border:1px solid var(--acc2); color:var(--text); padding:8px 20px; border-radius:10px; display:none; z-index:9; box-shadow:0 4px 16px #ff9fbd44; max-width:80vw; }
  .empty { color:var(--dim); text-align:center; padding:60px 0; }
  #askMask { position:fixed; inset:0; background:#5a3a4866; display:none; align-items:center; justify-content:center; z-index:99; }
  #askMask.act { display:flex; }
  .ask { background:#fffdfa; border:1px solid var(--line); border-radius:12px; padding:20px 24px; width:min(340px, 88vw); box-shadow:0 10px 30px #ff9fbd66; }
  .askT { font-weight:600; margin-bottom:6px; color:#e2568a; }
  .askD { font-size:12px; color:var(--dim); margin-bottom:16px; }
  .askBtns { display:flex; gap:10px; justify-content:flex-end; }
  #hostNote { display:none; color:var(--dim); font-size:11px; margin:-8px 0 16px 2px; }
  .bar input.dir { flex:1 1 260px; min-width:200px; width:auto; }
  .cfgsec { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:14px; box-shadow:0 2px 10px #ffb6c933; }
  .cfgsec-t { font-weight:600; font-size:13px; color:#e2568a; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .cfgsec-t::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); }
  .cfgrow { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px dashed #f8e3ec; }
  .cfgrow:last-child { border-bottom:none; }
  .cfgrow.flash { animation:cfgflash 1s ease; }
  @keyframes cfgflash { 0%{background:#ff7fa926} 100%{background:transparent} }
  .cfgname { flex:1 1 auto; min-width:0; }
  .cfgname b { font-weight:600; font-size:13px; }
  .cfghint { color:var(--dim); font-size:11px; margin-top:1px; }
  .cfghint.warn { color:var(--bad); }
  .cfgctl { flex:0 0 auto; display:flex; align-items:center; gap:8px; }
  input.cfgtext, select.cfgsel { background:#ffffffcc; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 10px; width:300px; max-width:44vw; outline:none; font-size:12px; transition:.15s; }
  input.cfgnum { background:#ffffffcc; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 10px; width:96px; outline:none; font-size:13px; transition:.15s; }
  input.cfgtext:focus, input.cfgnum:focus, select.cfgsel:focus { border-color:var(--acc); box-shadow:0 0 0 3px #ff7fa933; }
  select.cfgsel { cursor:pointer; }
  .sw { position:relative; display:inline-block; width:40px; height:22px; cursor:pointer; }
  .sw input { display:none; }
  .sw i { position:absolute; inset:0; background:#edd3de; border-radius:22px; transition:.2s; }
  .sw i::before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px #0002; }
  .sw input:checked + i { background:var(--acc); }
  .sw input:checked + i::before { transform:translateX(18px); }
  .cfgstat { flex:0 0 40px; font-size:11px; text-align:center; opacity:0; transition:.2s; }
  .cfgstat.show { opacity:1; }
  .cfgstat.ok { color:var(--ok); } .cfgstat.fail { color:var(--bad); }
  .cfgfoot { display:flex; align-items:center; gap:10px; padding:6px 4px 0; }
  #cfgStat { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<h1>蔗糖的表情包小屋~</h1>
<div class="sub" id="status">加载中…</div>
<div class="tabs">
  <div class="tab act" data-tab="stock">库存</div>
  <div class="tab" data-tab="cfg">插件配置</div>
</div>
<div id="viewStock">
  <div id="pathline"></div>
  <div id="drop">点击选择文件（支持 gif/png/jpg/webp，可多选）<br>截图后直接 Ctrl+V 粘贴也行<input type="file" id="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp"></div>
  <div id="hostNote">桌面端窗口里系统拖拽会被宿主壳（Tauri）拦截；想用拖拽，可在浏览器登录 WebUI 后从侧边栏打开本面板</div>
  <div class="bar">
    <input type="text" id="dirpath" class="dir" placeholder="批量导入兜底：粘贴本地文件夹路径，如 D:\表情包\收藏">
    <button class="btn" id="importDir">导入文件夹</button>
  </div>
  <div class="bar">
    <input type="text" id="q" placeholder="搜索 名称/标签/描述…">
    <button class="btn" id="reload">刷新</button>
    <span class="count" id="count"></span>
  </div>
  <div class="bar" id="filters">
    <button class="btn chipf active" data-f="all">全部<span class="n"></span></button>
    <button class="btn chipf warn" data-f="failed">失败<span class="n"></span></button>
    <button class="btn chipf" data-f="none">未打标<span class="n"></span></button>
    <button class="btn chipf" data-f="pending">打标中<span class="n"></span></button>
    <button class="btn chipf ok" data-f="complete">完成<span class="n"></span></button>
    <button class="btn warn" id="retryAll" style="display:none">重试所有失败</button>
  </div>
  <div id="grid"><div class="empty">加载中…</div></div>
</div>
<div id="viewCfg" style="display:none">
  <div class="sub">改动后自动保存并立即生效，无需重启</div>
  <div id="cfgpath"></div>
  <div id="cfgList"><div class="empty">加载中…</div></div>
  <div class="cfgfoot">
    <span id="cfgStat"></span>
    <button class="btn warn" id="cfgRetry" style="display:none">重试未保存项</button>
  </div>
</div>
<div id="toast"></div>
<div id="askMask"><div class="ask">
  <div class="askT" id="askTitle"></div>
  <div class="askD" id="askDetail"></div>
  <div class="askBtns">
    <button class="btn" id="askCancel">取消</button>
    <button class="btn warn" id="askOk">删除</button>
  </div>
</div></div>
<script>
const $ = s => document.querySelector(s);
const API = '/api/plug/astrbot_plugin_sticker_kit';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ITEMS = [];
let FILTER = 'all';
const STATUS_TXT = { complete:'完成', pending:'打标中', failed:'失败', none:'未打标' };

async function bridge() {
  for (let i = 0; i < 40; i++) {
    const b = window.AstrBotPluginView || window.AstrBotPluginPage;
    if (b) { try { await b.ready(); } catch (e) {} return b; }
    await new Promise(r => setTimeout(r, 100));
  }
  return null;
}

async function apiGet(path, params) {
  const b = await bridge();
  if (b) return await b.apiGet(path, params);
  const qs = params ? '?' + new URLSearchParams(params) : '';
  const r = await fetch(API + '/' + path + qs);
  const j = await r.json();
  if (j.status === 'error') throw new Error(j.message || '请求失败');
  return j.data ?? j;
}

async function apiPost(path, body) {
  const b = await bridge();
  if (b) return await b.apiPost(path, body || {});
  const r = await fetch(API + '/' + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (j.status === 'error') throw new Error(j.message || '请求失败');
  return j.data ?? j;
}

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.borderColor = bad ? 'var(--bad)' : 'var(--line)';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = 'none', 2600);
}

/* 桌面端 webview 沙箱禁掉了 window.confirm（直接返回 false，点了像没反应），自己画一个 */
function askConfirm(title, detail) {
  return new Promise((resolve) => {
    const mask = $('#askMask');
    $('#askTitle').textContent = title;
    $('#askDetail').textContent = detail || '';
    mask.classList.add('act');
    const done = (ok) => {
      mask.classList.remove('act');
      $('#askOk').onclick = null;
      $('#askCancel').onclick = null;
      mask.onclick = null;
      resolve(ok);
    };
    $('#askOk').onclick = () => done(true);
    $('#askCancel').onclick = () => done(false);
    mask.onclick = (e) => { if (e.target === mask) done(false); };
  });
}

/* ---------- 标签页切换（配置并进本页，不再跨页跳转） ---------- */
let cfgLoaded = false;
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('act', t.dataset.tab === name));
  $('#viewStock').style.display = name === 'stock' ? '' : 'none';
  $('#viewCfg').style.display = name === 'cfg' ? '' : 'none';
  if (name === 'cfg' && !cfgLoaded) { cfgLoaded = true; loadCfg(); }
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));

/* ================= 库存 ================= */
async function load() {
  $('#grid').innerHTML = '<div class="empty">加载中…</div>';
  try {
    const d = await apiGet('api/list');
    ITEMS = d.items || [];
    $('#status').innerHTML = d.llm_ready
      ? '打标 LLM：<b>已配置</b>（上传后自动打标）'
      : '打标 LLM：<i>未配置</i>（切到「插件配置」填 llm_api_key 后可自动打标）';
    if (d.data_dir) {
      $('#pathline').innerHTML = '数据保存在：<code>' + esc(d.data_dir) + '</code>　标注在 index.json，图片在 images/ 子目录　·　卡片上的「保存」= 把改好的标注写进 index.json，图片本身上传时就已存到 images/';
    }
    render();
  } catch (e) {
    $('#grid').innerHTML = '<div class="empty">加载失败：' + esc(e.message || e) + '</div>';
  }
}

async function thumbSrc(it) {
  const b = await bridge();
  if (b) {
    try {
      const d = await b.apiGet('api/image', { id: it.id, b64: '1' });
      if (d && d.b64) return d.b64;
    } catch (e) {}
    return '';
  }
  return API + '/api/image?id=' + it.id;
}

async function downloadImage(it) {
  try {
    toast('正在取图…');
    let src = await thumbSrc(it);
    if (!src) { toast('取图失败', true); return; }
    const name = (it.name || it.id).replace(/[\\/:*?"<>|]/g, '_') + extOf(it);
    if (src.startsWith('data:')) {
      const a = document.createElement('a');
      a.href = src; a.download = name; a.click();
    } else {
      const r = await fetch(src);
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }
    toast('已下载原图：' + name);
  } catch (e) {
    toast('下载失败：' + (e.message || e), true);
  }
}

function extOf(it) {
  const m = { 'image/gif':'.gif', 'image/png':'.png', 'image/webp':'.webp', 'image/jpeg':'.jpg' };
  return m[it.mime] || '.jpg';
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const stOf = it => it.analysis_status || 'none';
  const list = ITEMS.filter(it =>
    (FILTER === 'all' || stOf(it) === FILTER) &&
    (!q || [it.name, (it.tags||[]).join(' '), it.description, (it.emotions||[]).join(' '), it.visible_text||''].join(' ').toLowerCase().includes(q))
  );
  const cnt = {};
  for (const it of ITEMS) { const s = stOf(it); cnt[s] = (cnt[s]||0) + 1; }
  document.querySelectorAll('.chipf').forEach(c => {
    const f = c.dataset.f;
    c.querySelector('.n').textContent = f === 'all' ? ITEMS.length : (cnt[f] || 0);
  });
  $('#retryAll').style.display = (cnt.failed || 0) > 0 ? '' : 'none';
  let head = `共 ${ITEMS.length} 张`;
  if (FILTER !== 'all') head = `${STATUS_TXT[FILTER]} ${list.length} 张 / 共 ${ITEMS.length} 张`;
  if (q) head += `，匹配 ${list.length}`;
  $('#count').textContent = head;
  const grid = $('#grid');
  if (!list.length) {
    grid.innerHTML = FILTER === 'failed' && !q
      ? '<div class="empty">没有失败的，都是好孩子~</div>'
      : '<div class="empty">' + (ITEMS.length ? '没有匹配的表情包' : '没有表情包，先上传几张吧') + '</div>';
    return;
  }
  grid.innerHTML = '';
  for (const it of list) {
    const st = stOf(it);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb"><img alt="" loading="lazy">
        <span class="badge ${st}">${STATUS_TXT[st] || st}</span></div>
      <div class="meta">
        <input class="f name" value="${esc(it.name||'')}" placeholder="名称">
        <input class="f emo" value="${esc((it.emotions||[]).join('、'))}" placeholder="情绪（顿号分隔）">
        <input class="f tags" value="${esc((it.tags||[]).join('、'))}" placeholder="标签（顿号分隔）">
        <textarea class="f desc" placeholder="描述">${esc(it.description||'')}</textarea>
        <textarea class="f vtext" placeholder="图上文字">${esc(it.visible_text||'')}</textarea>
        ${it.analysis_error ? `<div class="err">${esc(it.analysis_error)}</div>` : ''}
        <div class="row">
          <button class="btn ok save">保存</button>
          <button class="btn re">重打标</button>
          <button class="btn dl">下载</button>
          <button class="btn warn del">删除</button>
          <span class="count" style="margin-left:auto">${it.usage_count||0}次</span>
        </div>
      </div>`;
    thumbSrc(it).then(src => { if (src) card.querySelector('img').src = src; });
    card.querySelector('.save').onclick = () => save(it, card);
    card.querySelector('.re').onclick = async () => {
      try { await apiPost('api/analyze', {id: it.id}); toast('已加入打标队列'); }
      catch (e) { toast(e.message || '失败', true); }
      load();
    };
    card.querySelector('.dl').onclick = () => downloadImage(it);
    card.querySelector('.del').onclick = async () => {
      const ok = await askConfirm('删除「' + (it.name||'') + '」？', '图片文件和标注会一起删掉，不可恢复。');
      if (!ok) return;
      try { await apiPost('api/delete', {id: it.id}); toast('已删除'); }
      catch (e) { toast(e.message || '失败', true); }
      load();
    };
    grid.appendChild(card);
  }
}

async function save(it, card) {
  const val = c => c.value.trim();
  const body = {
    id: it.id,
    name: val(card.querySelector('.name')),
    emotions: val(card.querySelector('.emo')).split(/[、,，\s]+/).filter(Boolean),
    tags: val(card.querySelector('.tags')).split(/[、,，\s]+/).filter(Boolean),
    description: val(card.querySelector('.desc')),
    visible_text: val(card.querySelector('.vtext')),
  };
  try { await apiPost('api/update', body); toast('已保存到库（index.json）'); }
  catch (e) { toast(e.message||'失败', true); }
  load();
}

document.querySelectorAll('.chipf').forEach(c => {
  c.onclick = () => {
    FILTER = c.dataset.f;
    document.querySelectorAll('.chipf').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    render();
  };
});

$('#retryAll').onclick = async () => {
  const bad = ITEMS.filter(it => (it.analysis_status || 'none') === 'failed');
  if (!bad.length) { toast('没有失败需要重试'); return; }
  toast(`正在重新打标 ${bad.length} 张（排队依次来）…`);
  for (const it of bad) {
    try { await apiPost('api/analyze', { id: it.id }); } catch (e) {}
  }
  toast('已全部重新排队打标');
  load();
};

const drop = $('#drop');
drop.onclick = () => $('#file').click();
$('#file').onchange = e => { upload([...e.target.files]); e.target.value = ''; };

/* ---------- 拖拽上传：全页接管 ----------
   不在 document 级 preventDefault 的话，webview 会把拖进来的图当导航打开（面板直接被图片顶掉），
   这就是"拖拽没用"的根因。接管后拖到页面任意位置都能上传。 */
const IMG_OK = f => !!f && (((f.type || '').startsWith('image/')) || /\.(jpe?g|png|gif|webp)$/i.test(f.name || ''));

let dragDepth = 0;
['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => {
  e.preventDefault();
  if (t === 'dragenter') dragDepth++;
  document.body.classList.add('dragging');
}));
document.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) document.body.classList.remove('dragging');
});
document.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const files = await filesFromDrop(e);
  const imgs = files.filter(IMG_OK);
  if (imgs.length) upload(imgs);
  else if (files.length) toast('拖进来的文件里没有支持的图片格式（gif/png/jpg/webp）', true);
  else toast('没拿到文件：这个窗口可能拦截了拖拽，试试点虚线框选文件，或把图片 Ctrl+V 粘贴进来', true);
});

async function filesFromDrop(e) {
  const dt = e.dataTransfer;
  if (!dt) return [];
  let files = [...(dt.files || [])];
  if (files.length) return files;
  /* 部分宿主/拖文件夹时 files 为空，用 items 的 entry API 递归读 */
  const entries = [...(dt.items || [])]
    .map(i => { try { return i.webkitGetAsEntry && i.webkitGetAsEntry(); } catch (_) { return null; } })
    .filter(Boolean);
  if (!entries.length) return [];
  files = [];
  for (const en of entries) files.push(...await walkEntry(en));
  return files;
}

function walkEntry(entry) {
  return new Promise(resolve => {
    if (!entry) return resolve([]);
    if (entry.isFile) { entry.file(f => resolve([f]), () => resolve([])); return; }
    if (entry.isDirectory) {
      const reader = entry.createReader();
      const out = [];
      const readBatch = () => reader.readEntries(async batch => {
        if (!batch.length) {
          const all = [];
          for (const en of out) all.push(...await walkEntry(en));
          return resolve(all);
        }
        out.push(...batch);
        readBatch();
      }, () => resolve([]));
      readBatch();
      return;
    }
    resolve([]);
  });
}

/* 粘贴兜底：截图 / 复制的图片直接 Ctrl+V 就传 */
document.addEventListener('paste', e => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => (f.type || '').startsWith('image/'));
  if (files.length) { e.preventDefault(); upload(files); }
});

async function upload(files) {
  files = (files || []).filter(IMG_OK);
  if (!files.length) return;
  toast('上传中…');
  try {
    const b = await bridge();
    let d;
    if (b) {
      d = { saved: 0, duplicated: [], rejected: [] };
      for (const f of files) {
        const r = await b.upload('api/upload', f);
        const part = r || {};
        d.saved += part.saved || (part.saved_one ? 1 : 0);
        (part.duplicated || []).forEach(x => d.duplicated.push(x));
        (part.rejected || []).forEach(x => d.rejected.push(x));
        if (part.llm_ready === false) d.llm_ready = false;
      }
    } else {
      const fd = new FormData();
      files.forEach(f => fd.append('files', f));
      d = await apiPost('api/upload', fd) || {};
      if (d instanceof FormData || !d.saved && !d.duplicated && !d.rejected) throw new Error('上传返回异常');
    }
    let msg = `成功 ${d.saved} 张（已存到 images/ 目录）`;
    if ((d.duplicated||[]).length) msg += `，重复跳过 ${d.duplicated.length} 张`;
    if ((d.rejected||[]).length) msg += `，拒绝 ${d.rejected.length} 张（${d.rejected[0]}）`;
    if (d.llm_ready === false) msg += `；打标 LLM 未配置，稍后可在「插件配置」里填好再逐张「重打标」`;
    toast(msg, (d.saved||0) === 0);
    load();
  } catch (e) {
    toast(e.message || '上传失败', true);
  }
}

$('#q').oninput = render;
$('#reload').onclick = load;

/* 宿主嵌入时提示拖拽限制（无跳转按钮——iframe sandbox 没给 allow-popups，任何弹窗/新标签打开都会被拦） */
try {
  if (window.self !== window.top) $('#hostNote').style.display = 'block';
} catch (_) { $('#hostNote').style.display = 'block'; }

$('#importDir').onclick = async () => {
  const p = $('#dirpath').value.trim();
  if (!p) { toast('先填文件夹路径', true); return; }
  toast('扫描中…');
  try {
    const d = await apiPost('api/import_dir', { path: p });
    let msg = `导入 ${d.saved} 张（递归含子目录）`;
    if (d.duplicated_total) msg += `，重复跳过 ${d.duplicated_total}`;
    if (d.rejected_total) msg += `，拒绝 ${d.rejected_total}`;
    if (d.truncated) msg += `；目录太大，只取前 ${d.scanned} 张`;
    toast(msg, d.saved === 0);
    if (d.saved) $('#dirpath').value = '';
    load();
  } catch (e) {
    toast(e.message || '导入失败', true);
  }
};
$('#dirpath').onkeydown = e => { if (e.key === 'Enter') $('#importDir').click(); };

/* ================= 插件配置 ================= */
let cfgItems = [];
let cfgFails = {};
let cfgTimer = 0;
let cfgTouched = false;
let cfgChain = Promise.resolve();

async function loadCfg() {
  try {
    const d = await apiGet('api/config');
    cfgItems = d.items || [];
    cfgFails = {};
    cfgTouched = false;
    $('#cfgpath').innerHTML = d.path ? `配置文件：<code>${esc(d.path)}</code>　·　这里的修改会写回 AstrBot 插件配置，与插件配置页通用` : '';
    syncFoot();
    renderCfg();
  } catch (e) {
    $('#cfgList').innerHTML = `<div class="empty">${esc(e.message || '配置加载失败')}</div>`;
  }
}

function cfgRow(it) {
  const warn = String(it.hint || '').startsWith('【');
  const name = `<div class="cfgname"><b>${esc(it.label)}</b>
    <div class="cfghint${warn ? ' warn' : ''}">${esc(it.hint || '')}</div></div>`;
  const isSecret = !!it.secret;
  const hasVal = !(it.value === '' || it.value == null);
  if (it.type === 'bool') {
    return `<div class="cfgrow">${name}
      <div class="cfgctl"><label class="sw"><input type="checkbox" data-k="${esc(it.key)}" data-t="bool"${it.value ? ' checked' : ''}><i></i></label></div>
      <span class="cfgstat"></span></div>`;
  }
  if (it.type === 'int') {
    return `<div class="cfgrow">${name}
      <div class="cfgctl"><input class="cfgnum" type="number" step="1" data-k="${esc(it.key)}" data-t="int" value="${Number(it.value) || 0}"></div>
      <span class="cfgstat"></span></div>`;
  }
  if (it.type === 'float') {
    return `<div class="cfgrow">${name}
      <div class="cfgctl"><input class="cfgnum" type="number" step="0.1" min="0" data-k="${esc(it.key)}" data-t="float" value="${Number(it.value) || 0}"></div>
      <span class="cfgstat"></span></div>`;
  }
  if ((it.options || []).length) {
    const opts = it.options.map(o => `<option value="${esc(o)}"${o === it.value ? ' selected' : ''}>${esc(o)}</option>`).join('');
    return `<div class="cfgrow">${name}
      <div class="cfgctl"><select class="cfgsel" data-k="${esc(it.key)}" data-t="str">${opts}</select></div>
      <span class="cfgstat"></span></div>`;
  }
  const type = isSecret ? 'password' : 'text';
  const ph = isSecret && hasVal ? '已设置（留空保持不变）' : '';
  return `<div class="cfgrow">${name}
    <div class="cfgctl"><input class="cfgtext" type="${type}" data-k="${esc(it.key)}" data-t="str" data-secret="${isSecret ? 1 : 0}"
      value="${isSecret ? '' : esc(it.value ?? '')}" placeholder="${esc(ph)}" autocomplete="off"></div>
    <span class="cfgstat"></span></div>`;
}

function renderCfg() {
  const order = [], map = new Map();
  for (const it of cfgItems) {
    if (!map.has(it.group)) { map.set(it.group, []); order.push(it.group); }
    map.get(it.group).push(it);
  }
  $('#cfgList').innerHTML = order.map(g => `
    <div class="cfgsec"><div class="cfgsec-t">${esc(g)}</div>
    ${map.get(g).map(cfgRow).join('')}</div>`).join('');
  $('#cfgList').querySelectorAll('[data-k]').forEach(el => {
    el.addEventListener(el.type === 'text' || el.type === 'password' || el.type === 'number' ? 'input' : 'change', queueSave);
  });
}

function cfgReadEl(el) {
  const t = el.dataset.t;
  if (t === 'bool') return !!el.checked;
  if (t === 'int') return Number(el.value) || 0;
  if (t === 'float') return Number(el.value) || 0;
  return String(el.value || '').trim();
}

/* 跟已保存的值逐项比对，只挑真正变了的字段；密钥留空视为未改 */
function cfgCollect() {
  const patch = {};
  $('#cfgList').querySelectorAll('[data-k]').forEach(el => {
    const key = el.dataset.k, t = el.dataset.t;
    const now = cfgReadEl(el);
    const it = cfgItems.find(x => x.key === key);
    if (!it) return;
    if (el.dataset.secret === '1' && !now) return;
    const base = it.value ?? '';
    const same = t === 'bool' ? now === !!base
      : (t === 'int' ? now === Number(base || 0)
      : (t === 'float' ? Math.abs(now - Number(base || 0)) < 1e-9
      : now === String(base)));
    if (!same) patch[key] = now;
  });
  return patch;
}

function cfgMark(key, state) {
  const el = $(`#cfgList [data-k="${key}"]`);
  const row = el && el.closest('.cfgrow');
  if (!row) return;
  const s = row.querySelector('.cfgstat');
  if (!s) return;
  s.className = 'cfgstat' + (state ? ' show' : '');
  if (state === 'ok') { s.textContent = '已存'; s.classList.add('ok'); }
  else if (state === 'fail') { s.textContent = '未存'; s.classList.add('fail'); }
  else if (state === 'saving') { s.textContent = '…'; }
  else s.textContent = '';
}

function syncFoot() {
  const bad = Object.keys(cfgFails).filter(k => cfgFails[k]);
  const stat = $('#cfgStat');
  if (bad.length) {
    stat.textContent = `${bad.length} 项没存上`;
    stat.style.color = 'var(--bad)';
    $('#cfgRetry').style.display = '';
  } else {
    stat.textContent = cfgTouched ? '已全部保存生效' : '';
    stat.style.color = '';
    $('#cfgRetry').style.display = 'none';
  }
}

/* 保存排队串行跑：上一次没回来时新改动不会被吞掉，最后一次 collect 自然带上全部 */
function queueSave() {
  cfgTouched = true;
  clearTimeout(cfgTimer);
  cfgTimer = setTimeout(flushCfg, 500);
}

function flushCfg() {
  clearTimeout(cfgTimer);
  cfgTimer = 0;
  cfgChain = cfgChain.then(doFlushCfg, doFlushCfg);
  return cfgChain;
}

async function doFlushCfg() {
  const patch = cfgCollect();
  const keys = Object.keys(patch);
  if (!keys.length) { syncFoot(); return; }
  keys.forEach(k => cfgMark(k, 'saving'));
  try {
    const d = await apiPost('api/config/set', { patch });
    (d.items || []).forEach(it => {
      const old = cfgItems.find(x => x.key === it.key);
      if (old) old.value = it.value;
    });
    keys.forEach(k => {
      cfgFails[k] = false;
      cfgMark(k, 'ok');
      const el = $(`#cfgList [data-k="${k}"]`);
      const row = el && el.closest('.cfgrow');
      if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
      if (el && el.dataset.secret === '1') el.value = '', el.placeholder = '已设置（留空保持不变）';
    });
    setTimeout(() => { keys.forEach(k => cfgMark(k, '')); }, 1400);
    cfgTouched = true;
  } catch (e) {
    keys.forEach(k => { cfgFails[k] = true; cfgMark(k, 'fail'); });
    toast(e.message || '保存失败', true);
  }
  syncFoot();
}

$('#cfgRetry').onclick = () => flushCfg();

/* 深链支持：?tab=cfg 直达配置标签（本页内切换，无导航） */
if (new URLSearchParams(location.search).get('tab') === 'cfg') switchTab('cfg');

load();
</script>
