<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔗糖的表情包小屋~</title>
<style>
  :root { --bg:#fff5f8; --panel:#fffdfa; --line:#f3c6d8; --text:#5a3a48; --dim:#b98da0; --acc:#ff7fa9; --acc2:#ffb3cd; --ok:#e8749c; --bad:#e06c5a; --pend:#d9a441; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    color:var(--text); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; padding:24px; min-height:100vh;
    background:linear-gradient(120deg,#ffe3ee,#fff0e0,#e8e3ff,#ffdff0,#ffe3ee);
    background-size:400% 400%;
    animation:bgflow 18s ease infinite;
  }
  @keyframes bgflow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  h1 { font-size:18px; font-weight:600; letter-spacing:.5px; margin-bottom:4px; color:#e2568a; text-shadow:0 1px 0 #fff; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:18px; }
  .sub b { color:var(--ok); } .sub i { color:var(--bad); font-style:normal; }
  #drop { border:1.5px dashed var(--line); border-radius:10px; padding:28px; text-align:center; color:var(--dim); cursor:pointer; transition:.2s; margin-bottom:20px; background:#ffffffa8; }
  #drop.hover, #drop:hover { border-color:var(--acc); color:#e2568a; background:#ffffffd9; }
  #drop input { display:none; }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .bar input[type=text] { background:#ffffffcc; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 12px; width:240px; outline:none; transition:.15s; }
  .bar input:focus { border-color:var(--acc); box-shadow:0 0 0 3px #ff7fa933; }
  .btn { background:#ffffffd9; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; transition:.15s; }
  .btn:hover { border-color:var(--acc); color:#e2568a; transform:translateY(-1px); }
  .btn.warn { color:var(--bad); }
  .btn.ok { color:var(--ok); }
  .count { color:var(--dim); font-size:12px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; transition:.18s; box-shadow:0 2px 10px #ffb6c933; }
  .card:hover { transform:translateY(-3px); box-shadow:0 8px 22px #ff9fbd44; border-color:var(--acc2); }
  .thumb { height:170px; background:#fff0f5; display:flex; align-items:center; justify-content:center; position:relative; }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .badge { position:absolute; top:6px; right:6px; font-size:11px; padding:1px 8px; border-radius:10px; background:#ffffffd9; border:1px solid var(--line); }
  .badge.complete { color:var(--ok); } .badge.pending { color:var(--pend); } .badge.failed,.badge.none { color:var(--bad); }
  .meta { padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .meta input.f { width:100%; background:transparent; border:none; border-bottom:1px solid transparent; color:var(--text); font-size:13px; padding:2px 0; outline:none; }
  .meta input.f:focus { border-bottom-color:var(--acc); }
  .meta input.name { font-weight:600; font-size:14px; }
  .meta textarea { width:100%; background:transparent; border:1px solid transparent; color:var(--dim); font-size:12px; resize:vertical; min-height:34px; outline:none; font-family:inherit; }
  .meta textarea:focus { border-color:var(--line); color:var(--text); }
  .row { display:flex; gap:6px; margin-top:auto; padding-top:6px; }
  .row .btn { padding:3px 10px; font-size:12px; flex:0 0 auto; }
  .err { color:var(--bad); font-size:11px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#fff; border:1px solid var(--acc2); color:var(--text); padding:8px 20px; border-radius:10px; display:none; z-index:9; box-shadow:0 4px 16px #ff9fbd44; }
  .empty { color:var(--dim); text-align:center; padding:60px 0; grid-column:1/-1; }
</style>
</head>
<body>
<h1>蔗糖的表情包小屋~</h1>
<div class="sub" id="status">加载中…</div>
<div id="drop">拖拽图片到此处，或点击选择文件（支持 gif/png/jpg/webp，可多选）<input type="file" id="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp"></div>
<div class="bar">
  <input type="text" id="q" placeholder="搜索 名称/标签/描述…">
  <button class="btn" id="reload">刷新</button>
  <span class="count" id="count"></span>
</div>
<div id="grid"><div class="empty">加载中…</div></div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const API = '/api/plug/astrbot_plugin_sticker_kit';
let ITEMS = [];

async function bridge() {
  for (let i = 0; i < 40; i++) {
    const b = window.AstrBotPluginView || window.AstrBotPluginPage;
    if (b) { try { await b.ready(); } catch (e) {} return b; }
    await new Promise(r => setTimeout(r, 100));
  }
  return null;
}

async function apiGet(path, params) {
  const b = await bridge();
  if (b) return await b.apiGet(path, params);
  const qs = params ? '?' + new URLSearchParams(params) : '';
  const r = await fetch(API + '/' + path + qs);
  const j = await r.json();
  if (j.status === 'error') throw new Error(j.message || '请求失败');
  return j.data ?? j;
}

async function apiPost(path, body) {
  const b = await bridge();
  if (b) return await b.apiPost(path, body || {});
  const r = await fetch(API + '/' + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
  const j = await r.json();
  if (j.status === 'error') throw new Error(j.message || '请求失败');
  return j.data ?? j;
}

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.borderColor = bad ? 'var(--bad)' : 'var(--line)';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = 'none', 2600);
}

async function load() {
  $('#grid').innerHTML = '<div class="empty">加载中…</div>';
  try {
    const d = await apiGet('api/list');
    ITEMS = d.items || [];
    $('#status').innerHTML = d.llm_ready
      ? '打标 LLM：<b>已配置</b>（上传后自动打标）'
      : '打标 LLM：<i>未配置</i>（插件配置里填 llm_api_base / llm_api_key / llm_model 后可自动打标）';
    render();
  } catch (e) {
    $('#grid').innerHTML = '<div class="empty">加载失败：' + esc(e.message || e) + '</div>';
  }
}

async function thumbSrc(it) {
  const b = await bridge();
  if (b) {
    try {
      const d = await b.apiGet('api/image', { id: it.id, b64: '1' });
      if (d && d.b64) return d.b64;
    } catch (e) {}
    return '';
  }
  return API + '/api/image?id=' + it.id;
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = ITEMS.filter(it => !q || [it.name, (it.tags||[]).join(' '), it.description, (it.emotions||[]).join(' ')].join(' ').toLowerCase().includes(q));
  $('#count').textContent = `共 ${ITEMS.length} 张${q ? '，匹配 ' + list.length : ''}`;
  const grid = $('#grid');
  if (!list.length) { grid.innerHTML = '<div class="empty">没有表情包，先上传几张吧</div>'; return; }
  grid.innerHTML = '';
  for (const it of list) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb"><img alt="" loading="lazy">
        <span class="badge ${it.analysis_status||'none'}">${it.analysis_status||'none'}</span></div>
      <div class="meta">
        <input class="f name" value="${esc(it.name||'')}" placeholder="名称">
        <input class="f emo" value="${esc((it.emotions||[]).join('、'))}" placeholder="情绪（顿号分隔）">
        <input class="f tags" value="${esc((it.tags||[]).join('、'))}" placeholder="标签（顿号分隔）">
        <textarea class="f desc" placeholder="描述">${esc(it.description||'')}</textarea>
        <textarea class="f vtext" placeholder="图上文字">${esc(it.visible_text||'')}</textarea>
        ${it.analysis_error ? `<div class="err">${esc(it.analysis_error)}</div>` : ''}
        <div class="row">
          <button class="btn ok save">保存</button>
          <button class="btn re">重打标</button>
          <button class="btn warn del">删除</button>
          <span class="count" style="margin-left:auto">${it.usage_count||0}次</span>
        </div>
      </div>`;
    thumbSrc(it).then(src => { if (src) card.querySelector('img').src = src; });
    card.querySelector('.save').onclick = () => save(it, card);
    card.querySelector('.re').onclick = async () => {
      try { await apiPost('api/analyze', {id: it.id}); toast('已加入打标队列'); }
      catch (e) { toast(e.message || '失败', true); }
      load();
    };
    card.querySelector('.del').onclick = async () => {
      if (!confirm('确定删除「' + (it.name||'') + '」？不可恢复')) return;
      try { await apiPost('api/delete', {id: it.id}); toast('已删除'); }
      catch (e) { toast(e.message || '失败', true); }
      load();
    };
    grid.appendChild(card);
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

async function save(it, card) {
  const val = c => c.value.trim();
  const body = {
    id: it.id,
    name: val(card.querySelector('.name')),
    emotions: val(card.querySelector('.emo')).split(/[、,，\s]+/).filter(Boolean),
    tags: val(card.querySelector('.tags')).split(/[、,，\s]+/).filter(Boolean),
    description: val(card.querySelector('.desc')),
    visible_text: val(card.querySelector('.vtext')),
  };
  try { await apiPost('api/update', body); toast('已保存'); }
  catch (e) { toast(e.message||'失败', true); }
  load();
}

const drop = $('#drop');
drop.onclick = () => $('#file').click();
$('#file').onchange = e => upload([...e.target.files]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hover'); };
drop.ondragleave = () => drop.classList.remove('hover');
drop.ondrop = e => { e.preventDefault(); drop.classList.add('hover'); drop.classList.remove('hover'); upload([...e.dataTransfer.files]); };

async function upload(files) {
  if (!files.length) return;
  toast('上传中…');
  try {
    const b = await bridge();
    let d;
    if (b) {
      d = { saved: 0, duplicated: [], rejected: [] };
      for (const f of files) {
        const r = await b.upload('api/upload', f);
        const part = r || {};
        d.saved += part.saved || (part.saved_one ? 1 : 0);
        (part.duplicated || []).forEach(x => d.duplicated.push(x));
        (part.rejected || []).forEach(x => d.rejected.push(x));
      }
    } else {
      const fd = new FormData();
      files.forEach(f => fd.append('files', f));
      d = await apiPost('api/upload', fd) || {};
      if (d instanceof FormData || !d.saved && !d.duplicated && !d.rejected) throw new Error('上传返回异常');
    }
    let msg = `成功 ${d.saved} 张`;
    if ((d.duplicated||[]).length) msg += `，重复跳过 ${d.duplicated.length} 张`;
    if ((d.rejected||[]).length) msg += `，拒绝 ${d.rejected.length} 张（${d.rejected[0]}）`;
    toast(msg, (d.saved||0) === 0);
    load();
  } catch (e) {
    toast(e.message || '上传失败', true);
  }
}

$('#q').oninput = render;
$('#reload').onclick = load;
load();
</script>
</body>
</html>
